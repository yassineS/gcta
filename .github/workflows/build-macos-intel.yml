name: Build macOS Intel

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload build artifacts'
        required: false
        default: 'true'
  workflow_call:
    secrets:
      inherit

jobs:
  build:
    name: Build GCTA Static Binary (macOS Intel)
    runs-on: macos-12
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          # Install build tools
          brew install cmake wget git gcc
          
          # Install Intel MKL via Homebrew
          brew install intel-mkl || echo "MKL installation might require manual setup"

      - name: Create build directory
        run: |
          mkdir -p ${{ runner.temp }}/gcta_build
          echo "BUILD_ROOT=${{ runner.temp }}/gcta_build" >> $GITHUB_ENV

      - name: Build dependencies (macOS Intel)
        run: |
          export GCTA_BUILD_ROOT="${{ env.BUILD_ROOT }}"
          
          chmod +x ./docs/build/build_deps_macos_intel.sh
          ./docs/build/build_deps_macos_intel.sh "${{ env.BUILD_ROOT }}"

      - name: Build GCTA (macOS Intel)
        run: |
          export GCTA_BUILD_ROOT="${{ env.BUILD_ROOT }}"
          export MKLROOT=$(brew --prefix intel-mkl)
          export EIGEN3_INCLUDE_DIR=${{ env.BUILD_ROOT }}/dependencies/eigen-3.3.7
          export SPECTRA_LIB=${{ env.BUILD_ROOT }}/dependencies/spectra-v1.2.0/include
          export BOOST_LIB=${{ env.BUILD_ROOT }}/boost_pkg/include
          
          chmod +x ./docs/build/build_gcta_macos_intel.sh
          ./docs/build/build_gcta_macos_intel.sh . "${{ env.BUILD_ROOT }}"

      - name: Verify binary
        run: |
          BINARY=${{ env.BUILD_ROOT }}/gcta/build_macos_intel/gcta64
          
          if [ -f "$BINARY" ]; then
            echo "✓ Binary exists"
            file "$BINARY"
            echo ""
            echo "Binary info:"
            ls -lh "$BINARY"
            echo ""
            echo "Testing binary:"
            "$BINARY" --help | head -10
            echo ""
            echo "Checking dependencies:"
            otool -L "$BINARY" | head -20
          else
            echo "✗ Binary not found at $BINARY"
            exit 1
          fi

      - name: Create artifact
        if: inputs.upload_artifact != 'false'
        run: |
          BINARY=${{ env.BUILD_ROOT }}/gcta/build_macos_intel/gcta64
          mkdir -p artifacts
          cp "$BINARY" artifacts/gcta64_macos_intel
          chmod +x artifacts/gcta64_macos_intel
          
          # Create checksum
          cd artifacts
          md5sum artifacts/gcta64_macos_intel > gcta64_macos_intel.md5
          shasum -a 256 artifacts/gcta64_macos_intel > gcta64_macos_intel.sha256
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: inputs.upload_artifact != 'false'
        with:
          name: gcta64_macos_intel
          path: |
            artifacts/gcta64_macos_intel
            artifacts/gcta64_macos_intel.md5
            artifacts/gcta64_macos_intel.sha256
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: gcta64-macos-intel-release
          path: artifacts/
          retention-days: 90
