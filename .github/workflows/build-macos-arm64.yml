name: Build macOS Apple Silicon

on:
  push:
    branches:
      - master
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload build artifacts'
        required: false
        default: 'true'

jobs:
  build:
    name: Build GCTA Static Binary (macOS Apple Silicon)
    runs-on: macos-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check architecture
        run: |
          echo "Architecture: $(uname -m)"
          echo "OS: $(uname -s)"
          echo "Processor: $(sysctl -n hw.processorsubtype)"

      - name: Set up build environment
        run: |
          # Install build tools
          brew install cmake wget git gcc gfortran
          
          # Note: Intel MKL support for Apple Silicon is limited
          # We use OpenBLAS which is built automatically

      - name: Create build directory
        run: |
          mkdir -p ${{ runner.temp }}/gcta_build
          echo "BUILD_ROOT=${{ runner.temp }}/gcta_build" >> $GITHUB_ENV

      - name: Build dependencies (macOS ARM64)
        run: |
          export GCTA_BUILD_ROOT="${{ env.BUILD_ROOT }}"
          
          chmod +x ./docs/build/build_deps_macos_arm64.sh
          ./docs/build/build_deps_macos_arm64.sh "${{ env.BUILD_ROOT }}"

      - name: Build GCTA (macOS ARM64)
        run: |
          export GCTA_BUILD_ROOT="${{ env.BUILD_ROOT }}"
          export OPENBLAS=${{ env.BUILD_ROOT }}/openblas_arm64_pkg
          export EIGEN3_INCLUDE_DIR=${{ env.BUILD_ROOT }}/dependencies/eigen-3.3.7
          export SPECTRA_LIB=${{ env.BUILD_ROOT }}/dependencies/spectra-1.0.0/include
          export BOOST_LIB=${{ env.BUILD_ROOT }}/boost_pkg_arm64/include
          
          chmod +x ./docs/build/build_gcta_macos_arm64.sh
          ./docs/build/build_gcta_macos_arm64.sh . "${{ env.BUILD_ROOT }}"

      - name: Verify binary
        run: |
          BINARY=${{ env.BUILD_ROOT }}/gcta/build_macos_arm64/gcta64
          
          if [ -f "$BINARY" ]; then
            echo "✓ Binary exists"
            file "$BINARY"
            echo ""
            echo "Binary info:"
            ls -lh "$BINARY"
            echo ""
            echo "Testing binary:"
            "$BINARY" --help | head -10
            echo ""
            echo "Checking dependencies:"
            otool -L "$BINARY" | head -20
          else
            echo "✗ Binary not found at $BINARY"
            exit 1
          fi

      - name: Create artifact
        if: inputs.upload_artifact != 'false'
        run: |
          BINARY=${{ env.BUILD_ROOT }}/gcta/build_macos_arm64/gcta64
          mkdir -p artifacts
          cp "$BINARY" artifacts/gcta64_macos_arm64
          chmod +x artifacts/gcta64_macos_arm64
          
          # Create checksum
          cd artifacts
          md5sum artifacts/gcta64_macos_arm64 > gcta64_macos_arm64.md5
          shasum -a 256 artifacts/gcta64_macos_arm64 > gcta64_macos_arm64.sha256
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: inputs.upload_artifact != 'false'
        with:
          name: gcta64_macos_arm64
          path: |
            artifacts/gcta64_macos_arm64
            artifacts/gcta64_macos_arm64.md5
            artifacts/gcta64_macos_arm64.sha256
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: gcta64-macos-arm64-release
          path: artifacts/
          retention-days: 90
